name: AI Auto Video

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: read

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          fc-cache -f

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and upload video
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_TTS_MODEL: ${{ vars.OPENAI_TTS_MODEL }}

          VIDEO_TOPIC: ${{ vars.VIDEO_TOPIC }}
          VIDEO_LANGUAGE: ${{ vars.VIDEO_LANGUAGE }}
          VIDEO_SCENES: ${{ vars.VIDEO_SCENES }}
          VIDEO_PRIVACY: ${{ vars.VIDEO_PRIVACY }}

          YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID }}

        run: python app.py

      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-output
          path: output/
          if-no-files-found: ignore
